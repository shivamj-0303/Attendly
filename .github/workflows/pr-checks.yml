name: PR Validation - Strict Quality Gates

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: |
          cd backend
          echo "Running Maven tests..."
          mvn clean test
        continue-on-error: false

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
        continue-on-error: true

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Backend (skip tests - already ran)
        run: |
          cd backend
          mvn clean package -DskipTests
        continue-on-error: false

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-pr-${{ github.event.pull_request.number }}
          path: backend/target/*.jar
          retention-days: 5

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: |
          cd landing-page
          npm ci

      - name: Run ESLint
        run: |
          cd landing-page
          npm run lint
        continue-on-error: false

  frontend-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: |
          cd landing-page
          npm ci

      - name: Type Check
        run: |
          cd landing-page
          npx tsc --noEmit
        continue-on-error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: |
          cd landing-page
          npm ci

      - name: Run Tests
        run: |
          cd landing-page
          npm run test -- --run
        continue-on-error: false
        env:
          CI: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install dependencies
        run: |
          cd landing-page
          npm ci

      - name: Build Production Bundle
        run: |
          cd landing-page
          npm run build
        env:
          VITE_API_BASE_URL: https://attendly-backend.onrender.com/api
        continue-on-error: false

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-pr-${{ github.event.pull_request.number }}
          path: landing-page/dist
          retention-days: 5

  mobile-validation:
    name: Mobile App Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: TypeScript Check
        working-directory: mobile-app
        run: npx tsc --noEmit
        continue-on-error: false

  pr-status:
    name: PR Status Check
    runs-on: ubuntu-latest
    needs: 
      - backend-tests
      - backend-build
      - frontend-lint
      - frontend-typecheck
      - frontend-build
      - mobile-validation
    if: always()
    
    steps:
      - name: Check All Jobs Status
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Backend Tests': '${{ needs.backend-tests.result }}',
              'Backend Build': '${{ needs.backend-build.result }}',
              'Frontend Lint': '${{ needs.frontend-lint.result }}',
              'Frontend TypeCheck': '${{ needs.frontend-typecheck.result }}',
              'Frontend Build': '${{ needs.frontend-build.result }}',
              'Mobile Validation': '${{ needs.mobile-validation.result }}'
            };
            
            const failed = Object.entries(jobs).filter(([_, status]) => status === 'failure');
            const cancelled = Object.entries(jobs).filter(([_, status]) => status === 'cancelled');
            
            let comment = '## PR Validation Results\n\n';
            
            // Job status table
            comment += '| Job | Status |\n';
            comment += '|-----|--------|\n';
            for (const [job, status] of Object.entries(jobs)) {
              const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
              comment += `| ${job} | ${icon} ${status} |\n`;
            }
            
            if (failed.length > 0) {
              comment += '\n### Failed Checks\n\n';
              for (const [job, _] of failed) {
                comment += `- **${job}**: Please fix the errors and push again\n`;
              }
              comment += '\n**This PR cannot be merged until all checks pass.**\n';
            } else if (cancelled.length > 0) {
              comment += '\n### Some checks were cancelled\n';
            } else {
              comment += '\n### All checks passed!\n\n';
              comment += 'This PR is ready for review and merge.\n';
            }
            
            comment += '\n---\n';
            comment += `*Checked at ${new Date().toISOString()}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
            // Fail workflow if any critical job failed
            if (failed.length > 0) {
              core.setFailed('One or more critical checks failed');
            }
