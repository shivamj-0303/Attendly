name: Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ========================================
  # PRE-DEPLOYMENT VALIDATION
  # ========================================
  validate-before-deploy:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd backend
          mvn clean test
        continue-on-error: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd landing-page
          npm ci

      - name: Frontend Lint
        run: |
          cd landing-page
          npm run lint
        continue-on-error: false

      - name: TypeScript Check
        run: |
          cd landing-page
          npx tsc --noEmit
        continue-on-error: false

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build Backend
        run: |
          cd backend
          mvn clean package -DskipTests
        continue-on-error: false

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-production-${{ github.run_number }}
          path: backend/target/*.jar
          retention-days: 30

      - name: Trigger Render Deployment
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully"

      - name: Wait for Deployment
        run: |
          echo "Waiting 60 seconds for deployment to start..."
          sleep 60

      - name: Health Check
        run: |
          echo "Checking backend health..."
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            
            if curl -f -s "${{ secrets.VITE_API_BASE_URL }}/health" > /dev/null 2>&1; then
              echo "Backend is healthy!"
              exit 0
            fi
            
            echo "Backend not ready yet, waiting 30 seconds..."
            sleep 30
            attempt=$((attempt + 1))
          done
          
          echo "Backend health check failed after $max_attempts attempts"
          exit 1

  deploy-unified-app:
    name: 🌐 Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend, build-and-upload-apk]
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install Dependencies
        run: |
          cd landing-page
          npm ci

      - name: Build Frontend
        run: |
          cd landing-page
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        continue-on-error: false

      - name: Deploy to Vercel Production
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./landing-page
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  build-and-upload-apk:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build Production APK
        working-directory: mobile-app
        run: |
          echo "🔧 Building APK with API URL: ${{ secrets.VITE_API_BASE_URL }}"
          
          export EXPO_PUBLIC_API_URL="${{ secrets.VITE_API_BASE_URL }}"
          
          echo "Starting EAS build..."
          eas build --platform android --profile production --local --non-interactive
          
          echo "Build complete!"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: false

      - name: Find and Package APK
        run: |
          APK_FILE=$(ls -t mobile-app/build-*.apk 2>/dev/null | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "APK file not found!"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          
          mkdir -p landing-page/public/downloads/
          cp "$APK_FILE" landing-page/public/downloads/attendly.apk
          
          ls -lh landing-page/public/downloads/attendly.apk
          echo "APK packaged successfully"

      - name: Get Version Info
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk-${{ steps.version.outputs.version }}
          path: landing-page/public/downloads/attendly.apk
          retention-days: 90

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Production Release ${{ steps.version.outputs.version }}
          body: |
            ## Attendly Mobile App - Production Release
            
            **Commit**: ${{ github.event.head_commit.message }}
            **SHA**: ${{ github.sha }}
            **Date**: $(date +'%Y-%m-%d %H:%M:%S UTC')
            
            ### Download
            - **Android APK**: Download `attendly.apk` below
            
            ### 🔗 Backend API
            - Connected to: ${{ secrets.VITE_API_BASE_URL }}
            
            ### Installation
            1. Download the APK file
            2. Enable "Install from Unknown Sources" on your Android device
            3. Install the APK
            4. Login with your credentials
            
            ---
            *Auto-generated by GitHub Actions*
          files: landing-page/public/downloads/attendly.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate-before-deploy, deploy-backend, build-and-upload-apk, deploy-unified-app]
    if: always()
    
    steps:
      - name: Create Deployment Summary
        uses: actions/github-script@v7
        with:
          script: |
            const validationStatus = '${{ needs.validate-before-deploy.result }}';
            const backendStatus = '${{ needs.deploy-backend.result }}';
            const mobileStatus = '${{ needs.build-and-upload-apk.result }}';
            const appStatus = '${{ needs.deploy-unified-app.result }}';
            const appUrl = '${{ needs.deploy-unified-app.outputs.deployment-url }}';
            
            const statusIcon = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              if (status === 'skipped') return '⏭️';
              return '⏳';
            };
            
            let summary = `# Production Deployment ${validationStatus === 'success' && backendStatus === 'success' && mobileStatus === 'success' && appStatus === 'success' ? 'Complete' : 'Status'}\n\n`;
            
            summary += `## Deployment Pipeline\n\n`;
            summary += `| Stage | Status | Details |\n`;
            summary += `|-------|--------|----------|\n`;
            summary += `| Pre-Deploy Validation | ${statusIcon(validationStatus)} | Tests, Lint, TypeCheck |\n`;
            summary += `| Backend API | ${statusIcon(backendStatus)} | ${{ secrets.VITE_API_BASE_URL }} |\n`;
            summary += `| Mobile APK | ${statusIcon(mobileStatus)} | [Download](https://github.com/${{ github.repository }}/releases/latest) |\n`;
            summary += `| Frontend | ${statusIcon(appStatus)} | ${appUrl || 'Pending'} |\n\n`;
            
            if (validationStatus === 'failure') {
              summary += `## Deployment Failed\n\n`;
              summary += `Pre-deployment validation failed. Please check the logs and fix:\n`;
              summary += `- Backend tests\n`;
              summary += `- Frontend linting\n`;
              summary += `- TypeScript type checking\n\n`;
            } else if (backendStatus === 'failure' || mobileStatus === 'failure' || appStatus === 'failure') {
              summary += `## Partial Deployment\n\n`;
              summary += `Some components failed to deploy. Please check the logs.\n\n`;
            } else {
              summary += `## Deployment Successful\n\n`;
              summary += `All components deployed successfully!\n\n`;
              summary += `### 🌐 Live URLs\n`;
              summary += `- **Landing Page**: ${appUrl}\n`;
              summary += `- **Admin Panel**: ${appUrl}/login\n`;
              summary += `- **Backend API**: ${{ secrets.VITE_API_BASE_URL }}\n`;
              summary += `- **APK Download**: https://github.com/${{ github.repository }}/releases/latest\n\n`;
            }
            
            summary += `---\n`;
            summary += `*Deployed at ${new Date().toISOString()}*\n`;
            summary += `*Commit: [\`${context.sha.substring(0, 7)}\`](https://github.com/${{ github.repository }}/commit/${context.sha})*`;
            
            await core.summary
              .addRaw(summary)
              .write();
            
            // Fail if critical steps failed
            if (validationStatus === 'failure' || backendStatus === 'failure') {
              core.setFailed('Deployment failed at critical stage');
            }
