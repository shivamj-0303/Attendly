spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  
  h2:
    console:
      enabled: false

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-jwt-token-generation-in-test-environment-only
  expiration: 3600000

# Email service mock
email:
  from: test@attendly.com
  enabled: false

# File upload paths
file:
  upload:
    profile-photos: target/test-uploads/profile-photos
